name: Rank registry

# Probes the public HyperEVM list and opens a pull request. It does not push
# to main. The token is chosen by .github/scripts/choose-rank-pr-token.sh.
# RANK_REGISTRY_TOKEN is used only when POST /pulls allows it. Otherwise the
# job GITHUB_TOKEN is used, and pull_request workflows wait for approval.

on:
  schedule:
    - cron: "17 16 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: rank-registry
  cancel-in-progress: false

jobs:
  rank:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    # Only this job gets write access: create-pull-request pushes registry/rankings and opens the PR.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Choose a token that can open the pull request
        id: pr-token
        env:
          RANK_REGISTRY_TOKEN: ${{ secrets.RANK_REGISTRY_TOKEN }}
        run: bash .github/scripts/choose-rank-pr-token.sh

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Probe and rank
        run: bun run rank

      - uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ steps.pr-token.outputs.use_pat == 'true' && secrets.RANK_REGISTRY_TOKEN || github.token }}
          commit-message: "chore: refresh HyperEVM RPC rankings"
          title: "chore: refresh HyperEVM RPC rankings"
          body: |
            Weekly probe of the public HyperEVM registry.

            The ranker merges the current upstream lists with community submissions, probes each HTTP endpoint, and rewrites `packages/smart-hyperevm/registry/nodes.json` and `packages/smart-hyperevm/registry/history.json`. Nodes without three successful probes spread across two weeks stay on the new-node weight cap.

            This pull request was opened by `.github/workflows/rank-registry.yml`. It does not push to `main`.
          branch: registry/rankings
          add-paths: |
            packages/smart-hyperevm/registry/nodes.json
            packages/smart-hyperevm/registry/history.json
          delete-branch: true
